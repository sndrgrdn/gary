name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8
          install_args: --locked
      - uses: actions/cache@v6
        with:
          path: .build
          key: build-xcode-26.6-${{ github.sha }}
          restore-keys: build-xcode-26.6-
      - uses: actions/cache@v6
        with:
          path: tools/anti-slop-swift/.build
          key: anti-slop-xcode-26.6-${{ hashFiles('tools/anti-slop-swift/Package.resolved') }}-${{ hashFiles('tools/anti-slop-swift/Package.swift', 'tools/anti-slop-swift/Sources/**') }}
          restore-keys: anti-slop-xcode-26.6-${{ hashFiles('tools/anti-slop-swift/Package.resolved') }}-
      - run: swift --version
      - run: npm ci
      - run: just lint
      - run: just build
      - run: just test
      - run: just typecheck
      - run: just dead-code
      - run: just anti-slop
