included:
  - Sources
  - Tests
  - Package.swift
  - scripts
excluded:
  - .build
  - build
  - Vendor
  - tmp

opt_in_rules:
  - all

disabled_rules:
  - accessibility_label_for_image
  - anonymous_argument_in_multiline_closure
  - attributes
  - closure_end_indentation
  - conditional_returns_on_newline
  - contrasted_opening_brace
  - discouraged_default_parameter
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - explicit_acl
  - explicit_enum_raw_value
  - explicit_top_level_acl
  - explicit_type_interface
  - file_name
  - file_types_order
  - indentation_width
  - legacy_objc_type
  - let_var_whitespace
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_call_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - no_extension_access_modifier
  - no_grouping_extension
  - no_magic_numbers
  - number_separator
  - one_declaration_per_file
  - opening_brace
  - optional_data_string_conversion
  - prefer_self_in_static_references
  - prefixed_toplevel_constant
  - required_deinit
  - sorted_enum_cases
  - switch_case_on_newline
  - trailing_closure
  - trailing_comma
  - type_contents_order
  - variable_shadowing
  - vertical_whitespace_between_cases

cyclomatic_complexity:
  ignores_case_statements: true

line_length:
  warning: 150
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_multiline_strings: true

identifier_name:
  excluded: [x, y, id, to, ok, at, by, fd, of]

custom_rules:
  no_waiting_in_tests:
    name: "No waiting in tests"
    included: "/Tests/"
    regex: '\b(Thread|Task)\.sleep\b|\busleep\(|\bsleep\(|\bsleep +[0-9]|run\(until:|before: *(Date|\.now)|asyncAfter|\.timeLimit\(|requestLine\([^)]*timeout: *[0-9.]*[1-9]|\.wait\(timeout|timeIntervalSinceNow|Date\(\)\.timeIntervalSince|Date\.now\(\)|CFRunLoopRunInMode\([^,]+, *[0-9.]*[1-9]'
    message: "Tests never sleep, wait for wall-clock time or set a timeout. Wait for the event itself (Events.next, Harness.settled, runMainRunLoop(until:)), drive timers with Harness.timers, or inject the clock."
    severity: error
  user_paths_through_paths:
    name: "User paths through Paths"
    included: "/Sources/"
    excluded: "/Sources/gary/Paths\\.swift$"
    regex: '\b(homeDirectoryForCurrentUser|NSHomeDirectory|NSTemporaryDirectory|temporaryDirectory|applicationSupportDirectory|cachesDirectory|userDomainMask)\b|\b(environment\[|getenv\()"(HOME|TMPDIR)"'
    message: "Resolve the home, temporary, Application Support and Caches folders through Paths, so GARY_HOME and GARY_RUNTIME_DIR isolate every file Gary reads or writes as its own."
    severity: error
